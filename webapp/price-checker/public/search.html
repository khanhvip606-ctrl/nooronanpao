<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Price Checker</title>

<link rel="stylesheet" href="style.css"/>

<style>
/* ================= GLOBAL ================= */
body{
  margin:0;
  font-family:"Poppins", sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:white;
}

/* ================= HEADER ================= */
header{
  padding:16px 30px;
  background: rgba(15,23,42,0.7);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.05);
  position:sticky;
  top:0;
}

header h2{
  margin:0;
  font-size:18px;
  letter-spacing:1px;
}

/* ================= SEARCH BOX ================= */
.search-box{
  max-width:800px;
  margin:40px auto 20px;
  display:flex;
  gap:10px;
  position:relative;
  animation: fadeUp 0.5s ease;
}

.search-box input{
  flex:1;
  padding:14px 16px;
  border-radius:12px;
  border:none;
  outline:none;
  background: rgba(255,255,255,0.08);
  color:white;
  backdrop-filter: blur(10px);
}

.search-box button{
  padding:14px 18px;
  border:none;
  border-radius:12px;
  background:#38bdf8;
  color:black;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.search-box button:hover{
  transform:scale(1.05);
}

/* ================= SUGGEST ================= */
#suggestBox{
  position:absolute;
  top:110%;
  left:0;
  right:0;

  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(12px);

  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);

  z-index:9999;

  max-height:240px;
  overflow-y:auto;
}

.suggest-item{
  padding:10px;
  cursor:pointer;
  transition:0.2s;
  font-size:13px;
}

.suggest-item:hover{
  background: rgba(56,189,248,0.2);
}

/* ================= RESULT ================= */
#result{
  max-width:800px;
  margin:0 auto;
  padding:10px 20px 50px;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>

</head>

<body>

<header>
  <h2>📊 PRICE CHECKER</h2>
</header>

<!-- SEARCH -->
<div class="search-box">

  <input
    id="searchInput"
    oninput="getSuggest()"
    placeholder="Enter product name..."
  />

  <button onclick="searchProduct()">
    SEARCH
  </button>

  <div id="suggestBox"></div>

</div>

<!-- RESULT -->
<div id="result"></div>
<!-- FOOTER -->
<div class="search-footer">

  <a href="/index.html">
    <span>🏠</span>
    <span>Home</span>
  </a>

  <a href="/upload.html">
    <span>⬆️</span>
    <span>Upload</span>
  </a>

</div>
<div class="chart-toggle">
  <button onclick="toggleChart()">📊 Show / Hide Profit Chart</button>
</div>

<canvas id="profitChart" style="display:none; margin-top:20px;"></canvas>
<script src="search.js"></script>

</body>
</html>
