<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Price Checker</title>

<link rel="stylesheet" href="style.css"/>

<style>

/* ================= BACKGROUND ================= */
body{
  margin:0;
  font-family:"Poppins", sans-serif;
  color:white;

  /* nền có lớp gradient + glow */
  background:
    radial-gradient(circle at 20% 20%, #1e293b, transparent 40%),
    radial-gradient(circle at 80% 80%, #0ea5e9, transparent 35%),
    linear-gradient(135deg, #020617, #0f172a);
}

/* ================= NAVBAR ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 30px;

  background: rgba(15,23,42,0.75);
  backdrop-filter: blur(14px);

  position:sticky;
  top:0;
  z-index:1000;

  border-bottom:1px solid rgba(255,255,255,0.05);
}

.navbar a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  opacity:0.7;
  transition:0.2s;
  font-size:14px;
}

.navbar a:hover{
  opacity:1;
  color:#38bdf8;
}

/* ================= MAIN CARD CONTAINER ================= */
.page-wrapper{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

/* box nền nổi */
.panel{
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:25px;

  backdrop-filter: blur(16px);

  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  animation: fadeUp 0.5s ease;
}

/* ================= SEARCH ================= */
.search-box{
  display:flex;
  gap:10px;
  position:relative;
  margin-bottom:20px;
}

.search-box input{
  flex:1;
  padding:14px 16px;
  border-radius:14px;
  border:none;
  outline:none;

  background: rgba(255,255,255,0.08);
  color:white;
}
