<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search</title>

<link rel="stylesheet" href="style.css"/>

<style>
#suggestBox{
  position:absolute;
  background:white;
  border:1px solid #ddd;
  width:100%;
  z-index:9999;
}

.search-box{
  position:relative;
}

.suggest-item{
  padding:10px;
  cursor:pointer;
}
.suggest-item:hover{
  background:#eee;
}
</style>

</head>

<body>

<header>
  <h2>PRICE CHECKER</h2>
</header>

<div class="search-box">

  <input id="searchInput" oninput="getSuggest()" placeholder="Enter product..."/>
  <button onclick="searchProduct()">SEARCH</button>

  <div id="suggestBox"></div>

</div>

<div id="result"></div>

<script src="search.js"></script>

</body>
</html>
