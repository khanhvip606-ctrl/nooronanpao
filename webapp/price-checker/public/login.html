<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Nooroo Nanpao Login
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body class="login-page">

  <div class="login-bg"></div>

  <div class="login-container fade-in">

    <div class="login-card">

      <div class="login-logo">
        🛡️
      </div>

      <h1>
        NOOROO NANPAO
      </h1>

      <p>
        Professional Price Checker System
      </p>

      <div class="login-input-group">

        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          autocomplete="off"
        >

      </div>

      <div class="login-input-group">

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
        >

      </div>

      <button
        class="login-btn"
        onclick="login()"
      >
        LOGIN SYSTEM
      </button>

      <div id="loginMsg"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
